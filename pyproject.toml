[project]
name = "wgtl-api-cli"
version = "0.1.0"
description = "CLI client for the Wagtail v3 API"
readme = "README.md"
license = "BSD-3-Clause"
classifiers = [
    # Update this based on your project's status.
    # See: https://pypi.org/classifiers/
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# See: https://devguide.python.org/versions/#supported-versions
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2",
    "clientele[cli]>=1.2",
    "tomli>=2; python_version<\"3.11\"",
]

[project.scripts]
wgtl = "wgtl_api_cli.cli.main:app"

[project.urls]
Homepage = "https://github.com/org-name-or-username/wgtl-api-cli"
Repository = "https://github.com/org-name-or-username/wgtl-api-cli"
Changelog = "https://github.com/org-name-or-username/wgtl-api-cli/blob/main/CHANGELOG.md"
Documentation = "https://github.com/org-name-or-username/wgtl-api-cli/tree/main/docs"
Issues = "https://github.com/org-name-or-username/wgtl-api-cli/issues"
# Add funding link if needed.
# Funding = "https://github.com/org-name-or-username/wgtl-api-cli"

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "respx>=0.21",
    "ruff>=0.6",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wgtl_api_cli"
source-exclude = [
    ".*",
    "*.js",
    "*.json",
    "*.ini",
    "*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live Wagtail v3 site (WGTL_TEST_BASE_URL/WGTL_TEST_TOKEN)"]
