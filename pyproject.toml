[project]
name = "wagtail-cli"
version = "0.2.0"
description = "CLI client for the Wagtail v3 API"
readme = "README.md"
license = "BSD-3-Clause"
classifiers = [
    # Update this based on your project's status.
    # See: https://pypi.org/classifiers/
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# See: https://devguide.python.org/versions/#supported-versions
# Must stay compatible with the demo group: Django 6.1 requires Python >=3.12.
requires-python = ">=3.12"
dependencies = [
    # 0.15.4 is the oldest typer that supports the CLI's `X | None` annotations.
    "typer>=0.15.4",
    "httpx>=0.27",
    "pydantic>=2",
]

[project.scripts]
wt = "wagtail_cli.cli.main:cli"

[project.urls]
Homepage = "https://github.com/wagtail/wagtail-cli"
Repository = "https://github.com/wagtail/wagtail-cli"
Changelog = "https://github.com/wagtail/wagtail-cli/blob/main/CHANGELOG.md"
Documentation = "https://github.com/wagtail/wagtail-cli/tree/main/docs"
Issues = "https://github.com/wagtail/wagtail-cli/issues"

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "respx>=0.21",
    "ruff>=0.6",
    "pytest-cov>=7.1.0",
    # The committed generated client requires clientele 2.3 (clientele.schemas,
    # clientele.api.Query, and the cli extra all appeared by 2.3.0).
    "clientele[cli]>=2.3",
]
demo = [
    # Dependencies for the demo Wagtail site in demo/.
    # Wagtail 8.0 supports Django 5.2/6.0/6.1, and Django 6.1 requires Python >=3.12.
    "django>=6.1",
    "wagtail>=8.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wagtail_cli"
source-exclude = [
    ".*",
    "*.js",
    "*.json",
    "*.ini",
    "*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live Wagtail v3 site (WAGTAIL_CLI_TEST_BASE_URL/WAGTAIL_CLI_TEST_TOKEN)"]
