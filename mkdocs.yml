site_name: wagtail-cli
repo_url: https://github.com/wagtail/wagtail-cli
site_url: https://wagtail.github.io/wagtail-cli
edit_uri: edit/main/docs/
repo_name: wagtail-cli

site_description: 'CLI client for the Wagtail v3 API'
dev_addr: localhost:8001

theme:
  name: material
  font: false
  logo: theme/favicon.png
  favicon: theme/favicon.png
  palette:
    scheme: default
    primary: white
  features:
    - content.code.copy
  custom_dir: docs/theme

markdown_extensions:
  - admonition
  - sane_lists
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      # Only include docs pages that are relevant to users of the project.
      sections:
        Getting started:
          - index.md
          - getting-started.md
        Usage:
          - usage.md
        Reference:
          - reference/api.md
          - reference/configuration.md
        # We do not publish contributing docs in the llms.txt sitemap.
        # Contributing:
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: false
            heading_level: 3
  - mkdocs-simple-hooks:
      hooks:
        on_post_build: 'docs.hooks:on_post_build'

# Excluded from the site: not part of the published docs.
exclude_docs: |
  SECURITY.md

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Usage: usage.md
  - Reference:
      - API: reference/api.md
      - Configuration: reference/configuration.md
  - Agent skills:
      - Overview: agent-skills.md
      - Skill evals: evals/README.md
  - Contributing:
      - Contributing guidelines: CONTRIBUTING.md
      - Design principles: contributing/design-principles.md
      - Development guide: contributing/development.md
  - Roadmap: ROADMAP.md
  - Changelog: CHANGELOG.md
